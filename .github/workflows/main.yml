name: Build KindleChess for Kindle

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'

permissions:
  contents: write

env:
  TARGET: kindlepw2
  KOX_RELEASE: "2025.05"
  STOCKFISH_TAG: "sf_18"

jobs:
  build:
    name: Build KUAL package with Stockfish
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Install build dependencies
        run: |
          set -euxo pipefail

          sudo apt-get update
          sudo apt-get install -y \
            build-essential autoconf automake bison flex gawk \
            libtool libtool-bin libncurses-dev curl file git gperf \
            help2man texinfo unzip wget sed libarchive-dev nettle-dev \
            meson ninja-build pkg-config zip python3 make binutils patchelf

      - name: Download prebuilt Kindle toolchain
        run: |
          set -euxo pipefail

          cd "$HOME"
          mkdir -p "$HOME/x-tools"

          curl -fL \
            -o "/tmp/${TARGET}.tar.gz" \
            "https://github.com/koreader/koxtoolchain/releases/download/${KOX_RELEASE}/${TARGET}.tar.gz"

          tar -xzf "/tmp/${TARGET}.tar.gz" -C "$HOME"

          echo "Toolchains found:"
          find "$HOME/x-tools" -maxdepth 4 -type d | sort

      - name: Install Kindle SDK
        run: |
          set -euxo pipefail

          git clone --recursive --depth=1 https://github.com/KindleModding/kindle-sdk.git /tmp/kindle-sdk
          cd /tmp/kindle-sdk
          chmod +x ./gen-sdk.sh
          ./gen-sdk.sh "$TARGET"

      - name: Locate Kindle cross file and tools
        run: |
          set -euxo pipefail

          echo "Searching for Meson cross file..."
          CROSS_FILE="$(find "$HOME/x-tools" -name meson-crosscompile.txt | head -n 1)"
          test -f "$CROSS_FILE"
          echo "CROSS_FILE=$CROSS_FILE" >> "$GITHUB_ENV"
          echo "Using cross file: $CROSS_FILE"

          echo "Searching for Kindle C++ compiler..."
          CXX_COMPILER="$(find "$HOME/x-tools" -type f \( -name '*g++' -o -name '*c++' \) | grep '/bin/' | head -n 1)"
          test -x "$CXX_COMPILER"
          echo "KINDLE_CXX=$CXX_COMPILER" >> "$GITHUB_ENV"
          echo "Using Kindle C++ compiler: $CXX_COMPILER"

          echo "Searching for Kindle strip tool..."
          STRIPPER="$(find "$HOME/x-tools" -type f -name '*strip' | grep '/bin/' | head -n 1 || true)"
          echo "KINDLE_STRIP=$STRIPPER" >> "$GITHUB_ENV"
          echo "Using strip tool: $STRIPPER"

          echo "Searching for Kindle readelf tool..."
          READELF_TOOL="$(find "$HOME/x-tools" -type f -name '*readelf' | grep '/bin/' | head -n 1 || true)"
          echo "KINDLE_READELF=$READELF_TOOL" >> "$GITHUB_ENV"
          echo "Using readelf tool: $READELF_TOOL"

      - name: Build KindleChess app
        run: |
          set -euxo pipefail

          rm -rf builddir_kindlehf

          meson setup --cross-file "$CROSS_FILE" builddir_kindlehf
          meson compile -C builddir_kindlehf

          if [ -n "${KINDLE_STRIP:-}" ] && [ -x "$KINDLE_STRIP" ]; then
            "$KINDLE_STRIP" builddir_kindlehf/kindlechess || true
          fi

          file builddir_kindlehf/kindlechess

      - name: Build Stockfish for Kindle
        run: |
          set -euxo pipefail

          git clone --depth=1 --branch "$STOCKFISH_TAG" https://github.com/official-stockfish/Stockfish.git /tmp/Stockfish

          cd /tmp/Stockfish/src

          make clean

          echo "Building Stockfish ${STOCKFISH_TAG} for Kindle ARMv7 with static runtime..."

          export LDFLAGS="-static-libstdc++ -static-libgcc"

          # Build with standard ARCH=armv7 for maximum compatibility across all Kindle i.MX6/ARMv7 processors
          make -j"$(nproc)" build ARCH=armv7 COMP=gcc COMPCXX="$KINDLE_CXX"

          # Use patchelf to set exact RPATH so it finds bundled libatomic.so.1 in ../lib without shell escaping bugs
          patchelf --set-rpath '$ORIGIN/../lib:$ORIGIN/lib' stockfish || true

          file stockfish

          if [ -n "${KINDLE_STRIP:-}" ] && [ -x "$KINDLE_STRIP" ]; then
            "$KINDLE_STRIP" stockfish || true
          fi

          install -m 0755 stockfish /tmp/stockfish-kindle
          file /tmp/stockfish-kindle

          echo "Checking Stockfish dynamic dependencies..."
          if [ -n "${KINDLE_READELF:-}" ] && [ -x "$KINDLE_READELF" ]; then
            "$KINDLE_READELF" -d /tmp/stockfish-kindle || true

            if "$KINDLE_READELF" -d /tmp/stockfish-kindle | grep -q 'libstdc++'; then
              echo "::error::Stockfish still dynamically links libstdc++.so.6. Static runtime link failed."
              exit 1
            fi

            if "$KINDLE_READELF" -d /tmp/stockfish-kindle | grep -q 'libgcc_s'; then
              echo "::warning::Stockfish still dynamically links libgcc_s. It may still work, but static-libgcc did not fully apply."
            fi
          fi

      - name: Package KUAL extension
        run: |
          set -euxo pipefail

          chmod +x scripts/package-kual.sh
          chmod +x extension/kindlechess/bin/start.sh

          ./scripts/package-kual.sh ./builddir_kindlehf/kindlechess

          install -m 0755 /tmp/stockfish-kindle dist/kindlechess/bin/stockfish

          mkdir -p dist/kindlechess/lib dist/kindlechess/licenses
          # Copy libatomic from toolchain so dynamic loader finds it via LD_LIBRARY_PATH on Kindle
          find "$HOME/x-tools" -name 'libatomic.so*' -exec cp -L {} dist/kindlechess/lib/ \; 2>/dev/null || true

          if [ -f /tmp/Stockfish/Copying.txt ]; then
            cp /tmp/Stockfish/Copying.txt dist/kindlechess/licenses/Stockfish-GPLv3-Copying.txt
          fi

          if [ -f /tmp/Stockfish/AUTHORS ]; then
            cp /tmp/Stockfish/AUTHORS dist/kindlechess/licenses/Stockfish-AUTHORS.txt
          fi

          cd dist
          rm -f kindlechess-kual.zip
          zip -r kindlechess-kual.zip kindlechess

          echo "Final package:"
          ls -lh kindlechess-kual.zip

          echo "Final binary folder:"
          ls -lh kindlechess/bin/

      - name: Upload KUAL zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: kindlechess-kual
          path: dist/kindlechess-kual.zip

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && format('KindleChess {0}', github.ref_name) || 'KindleChess Latest Build' }}
          draft: false
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/') }}
          files: dist/kindlechess-kual.zip
          body: |
            ### ♟️ KindleChess for Kindle Paperwhite 2/3, Voyage, Oasis

            Native GTK chess application for jailbroken Kindles running KUAL.

            #### 🚀 Highlights & Optimizations:
            - **Kindle Paperwhite 3 (300 ppi) & PW2 (212 ppi) optimized**: High-DPI crisp rendering, full-width responsive chessboard in portrait and side-panel in landscape.
            - **Zero-Allocation Chess Engine**: Sub-microsecond legal move generation for smooth, lag-free touch response.
            - **Hardware-Accelerated Stockfish 18**: Built with ARMv7 NEON SIMD vector optimization for Cortex-A9.
            - **E-Ink Display & Battery Friendly**: Minimal flashes, screensaver suppression while playing, buffered I/O, automatic log rotation to protect flash storage.

            #### 📦 Installation:
            1. Download `kindlechess-kual.zip` below.
            2. Extract the zip archive on your computer.
            3. Copy the extracted `kindlechess` folder to `/mnt/us/extensions/` on your Kindle via USB.
            4. Unplug USB, open **KUAL** on your Kindle, and tap **KindleChess** to play!
